[project]
name = "netdoc-sdk"
description = "Network Documentation Platform - SDK"
version = "0.6.5"
authors = [
    {name = "Andrea Cavazzini", email = "cavazzini.andrea@gmail.com"},
    {name = "Andrea Dainese", email = "andrea.dainese@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # HTTP client
    "httpx>=0.26",

    # Data validation
    "pydantic[email] (>=2.13.4,<3.0.0)",
]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12,<3.14"


[project.urls]
homepage = "https://github.com/NetDocLab/netdoc-sdk"
documentation = "https://github.com/NetDocLab/netdoc-sdk/wiki"
repository = "https://github.com/NetDocLab/netdoc-sdk/releases"
issues = "https://github.com/NetDocLab/netdoc-sdk/issues"


# ---------------------------------------------------------------------------
# Build system
# ---------------------------------------------------------------------------

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


# ---------------------------------------------------------------------------
# Poetry
# ---------------------------------------------------------------------------

[tool.poetry.group.dev.dependencies]
# Testing (unit tests)
factory-boy = ">=3.3"
faker = ">=20.0"
hypothesis = ">=6.90"
pre-commit = "^4.5.1"
pytest = ">=7.4"
pytest-asyncio = "^1.3.0"
pytest-cov = ">=4.1"
pytest-env = "^1.6.0"
responses = "^0.26.0"
respx = "^0.23.1"

# Testing (integration tests)
djangorestframework = ">=3.14,<4.0"
netdoc = {path = "../netdoc", develop = true}
pytest-django = "^4.12.0"

# Code quality
mypy = ">=1.7"
ruff = ">=0.1"

# Development tools
datamodel-code-generator = {extras = ["http"], version = "^0.66.3"}
ipython = ">=8.18"
jinja2 = ">=3.0"
netutils = "1.17.2"
pyyaml = ">=6.0"
watchdog = ">=3.0"

# Documentation
mkdocs = ">=1.5"
mkdocs-material = ">=9.5"
mkdocstrings = {version = ">=0.24", extras = ["python"]}


# ---------------------------------------------------------------------------
# Bandit — security linter
# ---------------------------------------------------------------------------


[tool.bandit]
# B101: assert used — expected in tests (already excluded above, belt-and-suspenders)
# B404: import subprocess — common and not inherently unsafe in an SDK
# B603: subprocess without shell=True — safe, explicit args list
skip = ["B101", "B404", "B603"]

# Minimum severity and confidence to report (LOW / MEDIUM / HIGH)
# MEDIUM/MEDIUM avoids noise from low-confidence findings
severity = "MEDIUM"
confidence = "MEDIUM"


# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["netdoc_sdk"]
omit = [
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]


# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
# Strict extras — enable incrementally as the codebase matures:
# strict = true


# ---------------------------------------------------------------------------
# pyright — kept off as mypy is the primary type checker
# ---------------------------------------------------------------------------

[tool.pyright]
typeCheckingMode = "off"


# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "netdoc.settings.test"
env = ["DJANGO_ENV=test", "SDK_STRICT=true"]
minversion = "7.0"
addopts = "-v -ra --strict-markers --strict-config --cov=netdoc_sdk --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
]
python_classes = ["Test*"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"


# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "__pycache__",
    ".git",
    ".venv",
    ".vscode",
    "build",
    "dist",
    "env",
    "migrations",
    "scripts",
    "venv",
]


[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false


[tool.ruff.lint]
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
    "ARG",  # flake8-unused-arguments
    "TCH",  # flake8-type-checking (moves TYPE_CHECKING imports correctly)
    "RUF",  # ruff-specific rules
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex — address gradually
    "E501",  # line too long — handled by ruff format
    "ARG001", # unused function argument — common in abstract/protocol methods
]


[tool.ruff.lint.isort]
known-first-party = ["netdoc_sdk"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]


[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG001", "ARG002"]
"tests/factories.py" = ["F401"]
"src/netdoc_sdk/models/_generated_models.py" = ["TC003"]
"src/netdoc_sdk/_generated_endpoints.py" = ["TC001", "TC003"]
